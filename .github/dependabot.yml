version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 公開直後に見つかる不正なリリースを取り込まないように、公開から 7 日たったバージョンだけを PR にする
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint が対応するまで、TypeScript はパッチの更新だけにする
      - dependency-name: typescript
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # @types/node は実行環境の Node.js のメジャーバージョンに合わせて、手動で上げる
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      infra-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node は実行環境の Node.js のメジャーバージョンに合わせて、手動で上げる
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
