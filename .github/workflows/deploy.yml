name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # ハッシュ付きのファイルは中身が変わると名前も変わるので、1 年キャッシュする
      - name: Upload hashed assets
        run: aws s3 sync dist/assets "s3://$S3_BUCKET/assets" --cache-control "public, max-age=31536000, immutable"

      # index.html などハッシュの付かないファイルは、ブラウザが毎回更新を確かめるようにする
      - name: Upload other files
        run: aws s3 sync dist "s3://$S3_BUCKET" --delete --exclude "assets/*" --cache-control "no-cache"

      # 新しい index.html を置いたあとで、使われなくなった古いファイルを消す
      - name: Remove old assets
        run: aws s3 sync dist/assets "s3://$S3_BUCKET/assets" --delete --cache-control "public, max-age=31536000, immutable"

      # CloudFront にキャッシュされた古いファイルを無効化する
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
